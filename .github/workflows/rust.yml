name: Rust builds

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "services/agent/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "services/agent/**"
      - ".github/workflows/rust.yml"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust target
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools && rustup target add ${{ matrix.target }}

      - name: Install Rust target
        if: runner.os != 'Linux'
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p linux-resource-monitor

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/linux-resource-monitor.exe" "release-assets/${{ matrix.artifact }}.exe"
          else
            cp "target/${{ matrix.target }}/release/linux-resource-monitor" "release-assets/${{ matrix.artifact }}"
          fi

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Read crate version
        id: version
        run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' services/agent/Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*